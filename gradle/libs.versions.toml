[versions]
kotlin = "2.4.21"
# Compose Multiplatform (plugin + runtime) for the :shared module. 1.12 needs
# compileSdk 37 (targetSdk stays 36). compose-bom below is the androidx BOM on the
# same Compose line (1.12), so the app and :shared agree.
compose-multiplatform = "1.12.2"
agp = "9.5.1"
# One Ktor version everywhere: Kotlin/Native needs every Ktor module on the same
# version (a mismatched Darwin engine can link and fail at the first response), so
# :shared also pins iOS and web through ktor-bom.
ktor = "3.6.1"
kotlinx-serialization = "1.13.0"
kotlinx-coroutines = "1.11.0"
# File IO for the shared app code (AppFiles).
okio = "3.18.2"
# Two versions on purpose. Android needs 1.30.0 (16 KB pages). The JVM artifact of
# 1.30.0 dies with SIGSEGV on the production VPS (docs/DEPLOY-ONNX-1.30-ROLLBACK-2026-09-27.md),
# so the server stays on the version it has always run.
onnxruntime-jvm = "1.20.0"
onnxruntime-android = "1.30.0"
kotlin-logging = "8.0.7"
slf4j = "2.0.20"
postgresql = "42.7.14"
hikaricp = "7.1.0"
sqlite = "3.54.1.0"
micrometer = "1.17.2"
awssdk = "2.59.2"
embedded-postgres = "2.2.2"
embedded-postgres-binaries = "16.16.0"
jedis = "8.0.2"
nimbus-jose-jwt = "10.10"
embedded-redis = "1.4.4"

androidx-core = "1.19.1"
androidx-fragment = "1.9.1"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"
compose-bom = "2026.11.01"
# Coil 3 is multiplatform (images in the shared UI). 3.6 is built on Compose
# Multiplatform 1.12. Android keeps OkHttp 4.12 as the
# network fetcher, iOS uses Ktor.
coil = "3.6.3"
# Multiplatform ViewModel and lifecycle for the shared UI, the versions Compose
# Multiplatform 1.12 itself depends on. On Android they resolve to androidx.lifecycle.
lifecycle-multiplatform = "2.11.0"
# The iOS back gesture (edge swipe) reaches Compose through navigationevent; 1.1.0 is
# the line Compose Multiplatform 1.12 already brings on iOS (navigationevent core).
navigationevent-multiplatform = "1.1.0"
# Material 3 for the shared UI. 1.9.0 is the one whose Android artifact is
# androidx material3 1.4.0, the same the app already ships (1.10+/1.11 are alphas
# that pull material3 1.5.0 alphas). Icons are frozen at 1.7.3 and map onto the
# androidx icons the BOM already brings.
compose-material3-multiplatform = "1.9.0"
compose-material-icons-multiplatform = "1.7.3"
androidx-credentials = "1.6.0"
googleid = "1.2.1"
junit = "4.13.2"
robolectric = "4.18"
androidx-test-ext-junit = "1.3.0"

[libraries]
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
okio-fakefilesystem = { module = "com.squareup.okio:okio-fakefilesystem", version.ref = "okio" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }

onnxruntime = { module = "com.microsoft.onnxruntime:onnxruntime", version.ref = "onnxruntime-jvm" }
