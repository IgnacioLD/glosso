[versions]
kotlin = "2.4.20"
# Compose Multiplatform (plugin + runtime) for the :shared module. Kept on the line
# whose Android artifacts fit compileSdk 36: CMP 1.11.1 maps onto androidx.compose
# 1.11.2 (1.12 needs compileSdk 37). compose-bom below is the androidx BOM with that
# same Compose (1.11.2), so the app and :shared agree.
compose-multiplatform = "1.11.1"
# The newest AGP inside Kotlin 2.4.20's tested range (AGP 8.5.2-9.3.1, Gradle up to
# 9.7.0; 9.3.3 and Gradle 9.7.1 are patch releases of those). AGP 9.3 needs Gradle 9.5+.
agp = "9.3.3"
ktor = "3.0.3"
# Ktor on iOS: Coil's Ktor fetcher (coil-network-ktor3 3.5.0) lifts ktor-client-core
# to 3.1.0 there, and Kotlin/Native needs every Ktor module on that same version (a
# 3.0.3 Darwin engine links but fails at the first response with IrLinkageError).
# :shared aligns its iOS source set to this through ktor-bom.
ktor-ios = "3.1.0"
kotlinx-serialization = "1.7.3"
kotlinx-coroutines = "1.9.0"
# File IO for the shared app code (AppFiles). Same version Coil 2 already brings to the
# Android app, so the runtime classpath does not change.
okio = "3.9.0"
# Two versions on purpose. Android needs 1.30.0 (16 KB pages). The JVM artifact of
# 1.30.0 dies with SIGSEGV on the production VPS (docs/DEPLOY-ONNX-1.30-ROLLBACK-2026-09-27.md),
# so the server stays on the version it has always run.
onnxruntime-jvm = "1.20.0"
onnxruntime-android = "1.30.0"
kotlin-logging = "7.0.0"
slf4j = "2.0.16"
postgresql = "42.7.13"
hikaricp = "6.2.1"
sqlite = "3.47.1.0"
micrometer = "1.13.6"
awssdk = "2.55.1"
embedded-postgres = "2.2.2"
embedded-postgres-binaries = "16.2.0"
jedis = "5.1.0"
nimbus-jose-jwt = "10.5"
embedded-redis = "1.4.3"

androidx-core = "1.15.0"
androidx-fragment = "1.9.1"
androidx-activity-compose = "1.9.3"
androidx-lifecycle = "2.8.7"
compose-bom = "2026.05.01"
# Coil 3 is multiplatform (images in the shared UI). 3.5.0 is built on Compose
# Multiplatform 1.11.1 (3.6 needs 1.12). Android keeps OkHttp 4.12 as the
# network fetcher, iOS uses Ktor.
coil = "3.5.0"
# Multiplatform ViewModel and lifecycle for the shared UI, the versions Compose
# Multiplatform 1.11.1 itself depends on. On Android they resolve to androidx.lifecycle.
lifecycle-multiplatform = "2.9.6"
# The iOS back gesture (edge swipe) reaches Compose through navigationevent; 1.0.1 is
# the line Compose Multiplatform 1.11 already brings on iOS (navigationevent core).
navigationevent-multiplatform = "1.1.0"
# Material 3 for the shared UI. 1.9.0 is the one whose Android artifact is
# androidx material3 1.4.0, the same the app already ships (1.10+/1.11 are alphas
# that pull material3 1.5.0 alphas). Icons are frozen at 1.7.3 and map onto the
# androidx icons the BOM already brings.
compose-material3-multiplatform = "1.9.0"
compose-material-icons-multiplatform = "1.7.3"
androidx-credentials = "1.5.0"
googleid = "1.1.1"
junit = "4.13.2"
robolectric = "4.17"
androidx-test-ext-junit = "1.2.1"

