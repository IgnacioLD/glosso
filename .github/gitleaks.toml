# Configuracion de gitleaks para Glosso Pro. Usa las reglas por defecto y anade
# exclusiones SOLO por ruta y por patron de relleno. Nunca se mete el valor de un
# secreto real aqui. Ver docs/OWASP-BACKEND.md (A06/A08).
title = "Glosso Pro gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Falsos positivos conocidos: placeholders de .env, fixtures de test y auditorias ya redactadas"
# Rutas donde un valor con pinta de clave es de relleno por construccion.
paths = [
  '''deploy/\.env\.example''',
  '''server/src/test/''',
  '''docs/SECRETS-AUDIT.*\.md''',
  '''docs/LICENSING.*\.md''',
  '''docs/LICENSE.*\.md''',
  '''licenses/''',
  '''COMMERCIAL-LICENSING\.md''',
  '''NOTICE''',
  '''benchmark/''',
]
regexTarget = "match"
# Patrones de relleno, no valores reales.
regexes = [
  '''(?i)CHANGE_ME''',
  '''(?i)placeholder''',
  '''(?i)replace[-_ ]?me''',
  '''(?i)REDACTED''',
  '''xi-api-key=REDACTED''',
]
