# gitleaks configuration for Glosso. Uses the default rules and adds exclusions
# ONLY by path and by placeholder pattern. Never put a real secret value here.
title = "Glosso gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Known false positives: .env placeholders, test fixtures and redacted docs"
# Paths where a key-looking value is a placeholder by construction.
paths = [
  '''deploy/\.env\.example''',
  '''server/src/test/''',
  '''docs/LICENSING.*\.md''',
  '''licenses/''',
  '''NOTICE''',
]
regexTarget = "match"
# Placeholder patterns, not real values.
regexes = [
  '''(?i)CHANGE_ME''',
  '''(?i)placeholder''',
  '''(?i)replace[-_ ]?me''',
  '''(?i)REDACTED''',
  '''xi-api-key=REDACTED''',
]
