org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
kotlin.code.style=official
# We define our own jvm+android shared source set (onnxMain) explicitly, so the
# default hierarchy template is not applied.
kotlin.mpp.applyDefaultHierarchyTemplate=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# The iOS recognizer lives in iosMain (shared by iosArm64 and iosSimulatorArm64)
# and needs the ONNX Runtime cinterop commonized for it.
kotlin.mpp.enableCInteropCommonization=true
